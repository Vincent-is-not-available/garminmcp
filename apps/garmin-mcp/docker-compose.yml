services:
  garmin-mcp:
    image: ghcr.io/vincent-is-not-available/garmin-mcp-server:1.2
    volumes:
      - ${APP_DATA_DIR}/data:/root/.garminconnect:ro
    environment:
      - TZ=Europe/Paris
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN}
    restart: unless-stopped
    x-runtipi:
      is_main: true
      internal_port: 8000

x-runtipi:
  schema_version: 2
